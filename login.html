<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="یازدهم‌پلاس؛ پلتفرم مطالعه و یادگیری یازدهم رشته ریاضی"
    >

    <title>ورود | یازدهم‌پلاس</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <!-- Logo -->

            <div class="login-logo">

                <div class="logo-mark">
                    ی+
                </div>

                <div class="logo-text">
                    <strong>
                        یازدهم‌پلاس
                    </strong>

                    <span>
                        مسیر بهتر برای یادگیری
                    </span>
                </div>

            </div>


            <!-- Title -->

            <div class="login-heading">

                <span>
                    خوش آمدی
                </span>

                <h1>
                    وارد حساب خودت شو
                </h1>

                <p>
                    برای ادامه، یک نام کاربری انتخاب کن.
                </p>

            </div>


            <!-- Login Form -->

            <form
                id="loginForm"
                class="login-form"
                autocomplete="off"
            >

                <label for="username">
                    نام کاربری
                </label>


                <input
                    id="username"
                    name="username"
                    type="text"
                    placeholder="مثلاً Sina"
                    minlength="2"
                    maxlength="30"
                    autocomplete="username"
                    required
                >


                <div
                    id="loginError"
                    class="login-error"
                    role="alert"
                    aria-live="polite"
                ></div>


                <button
                    type="submit"
                    class="login-button"
                >
                    ورود به یازدهم‌پلاس
                    <span>←</span>
                </button>

            </form>


            <!-- Info -->

            <div class="login-info">

                <span>
                    شروع سریع
                </span>

                <p>
                    فعلاً ورود با نام کاربری انجام می‌شود.
                    اطلاعات پیشرفت و XP روی همین دستگاه ذخیره می‌شود.
                </p>

            </div>

        </section>


        <footer class="login-footer">

            یازدهم‌پلاس
            <span>•</span>
            مخصوص یازدهم رشته ریاضی

        </footer>

    </main>


    <!-- User System -->

    <script src="js/user.js"></script>

    <!-- Login -->

    <script src="js/login.js"></script>

</body>

</html>
