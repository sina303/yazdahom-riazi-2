```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود | یازدهم ریاضی</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                ∑
            </div>

            <span class="login-label">
                یازدهم ریاضی
            </span>

            <h1>
                خوش اومدی
            </h1>

            <p class="login-description">
                برای ورود به حساب کاربری، نام کاربری خودت رو وارد کن.
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        نام کاربری
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="مثلاً sina"
                        autocomplete="username"
                        maxlength="30"
                        required
                    >

                </div>

                <p
                    id="loginError"
                    class="login-error"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="login-button"
                >
                    ورود به سایت
                </button>

            </form>

            <p class="login-note">
                حساب کاربری شما برای ذخیره‌ی پیشرفت، XP و فعالیت‌های آموزشی استفاده می‌شود.
            </p>

        </section>

    </main>

    <script src="user.js"></script>
    <script src="login.js"></script>

</body>

</html>
```
