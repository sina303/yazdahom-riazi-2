<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پروفایل | AXIS</title>
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>

  <!-- پس‌زمینه متحرک اعداد ریاضی -->
  <div class="math-bg" id="mathBg"></div>

  <header class="profile-header">
    <div class="brand">AXIS</div>
    <nav>
      <a href="index.html">خانه</a>
      <a href="hesaban.html">حسابان</a>
      <a href="profile.html">پروفایل</a>
    </nav>
    <div class="user">یازدهم ریاضی</div>
  </header>

  <main>

    <!-- HERO -->
    <section class="profile-hero">
      <div class="profile-avatar" id="avatarLetter">S</div>
      <div class="profile-info">
        <h1 id="usernameDisplay">کاربر</h1>
        <p>دانش‌آموز یازدهم ریاضی — AXIS</p>
      </div>
    </section>

    <!-- STATS -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="label">XP</span>
        <div class="value" id="statXp">0</div>
        <span class="sub">امتیاز تجربه</span>
      </div>
      <div class="stat-card">
        <span class="label">Level</span>
        <div class="value" id="statLevel">1</div>
        <span class="sub">سطح</span>
      </div>
      <div class="stat-card">
        <span class="label">Solved</span>
        <div class="value" id="statSolved">0</div>
        <span class="sub">سوال حل‌شده</span>
      </div>
      <div class="stat-card">
        <span class="label">Correct</span>
        <div class="value" id="statCorrect">0</div>
        <span class="sub">پاسخ درست</span>
      </div>
    </section>

    <!-- LEVEL -->
    <section class="level-section">
      <div class="level-header">
        <div>
          <span class="label">Progress</span>
          <h2>سطح فعلی</h2>
        </div>
      </div>
      <div class="level-progress">
        <div><i id="levelBar" style="width: 0%"></i></div>
      </div>
      <div class="level-meta">
        <span id="levelCurrent">سطح ۱</span>
        <span id="levelNext">تا سطح بعدی ۱۰۰ XP</span>
      </div>
    </section>

    <!-- SUBJECT PROGRESS -->
    <section class="subject-progress-section">
      <span class="section-label">Learning Path</span>
      <h2>پیشرفت دروس</h2>

      <div class="subject-progress-card">
        <div>
          <h3>حسابان</h3>
          <p id="hesabanProgressText">در حال یادگیری</p>
        </div>
        <div class="percent" id="hesabanPercent">0%</div>
      </div>
    </section>

  </main>

  <!-- =========================================
  MATH BACKGROUND + PROFILE SCRIPT
  ========================================= -->
  <script>
    /* پس‌زمینه متحرک */
    function createMathBackground() {
      const bg = document.getElementById("mathBg");
      if (!bg) return;

      const symbols = [
        "∫", "∑", "π", "√", "∞", "Δ", "θ", "λ",
        "x²", "aⁿ", "f(x)", "sin", "cos", "tan",
        "∂", "≈", "≠", "≤", "≥", "α", "β", "γ",
        "+", "−", "×", "÷", "=", "%", "e", "i",
        "1", "2", "3", "7", "9", "0", "½", "¼"
      ];

      for (let i = 0; i < 30; i++) {
        const span = document.createElement("span");
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.fontSize = (14 + Math.random() * 34) + "px";
        span.style.left = (Math.random() * 100) + "%";
        span.style.animationDuration = (12 + Math.random() * 18) + "s";
        span.style.animationDelay = "-" + (Math.random() * 15) + "s";
        span.style.color = "rgba(53, 211, 90, " + (0.08 + Math.random() * 0.18) + ")";
        bg.appendChild(span);
      }
    }

    /* خواندن اطلاعات کاربر */
    function getUser() {
      const raw = localStorage.getItem("y11_math_user");
      if (!raw) {
        return {
          username: "Sina",
          xp: 0,
          solved: 0,
          correct: 0,
          wrong: 0,
          solvedQuestions: []
        };
      }
      try {
        const u = JSON.parse(raw);
        return {
          username: u.username || "Sina",
          xp: u.xp || 0,
          solved: u.solved || 0,
          correct: u.correct || 0,
          wrong: u.wrong || 0,
          solvedQuestions: u.solvedQuestions || []
        };
      } catch (e) {
        return {
          username: "Sina",
          xp: 0,
          solved: 0,
          correct: 0,
          wrong: 0,
          solvedQuestions: []
        };
      }
    }

    /* نمایش اطلاعات */
    function renderProfile() {
      const user = getUser();
      const xp = user.xp;
      const solved = user.solved;
      const correct = user.correct;
      const username = user.username;

      document.getElementById("usernameDisplay").textContent = username;
      document.getElementById("avatarLetter").textContent =
        (username.charAt(0) || "U").toUpperCase();

      document.getElementById("statXp").textContent = xp;
      document.getElementById("statSolved").textContent = solved;
      document.getElementById("statCorrect").textContent = correct;

      /* سطح */
      let level = 1;
      let levelStart = 0;
      let levelEnd = 100;

      if (xp >= 700) { level = 5; levelStart = 700; levelEnd = 1000; }
      else if (xp >= 450) { level = 4; levelStart = 450; levelEnd = 700; }
      else if (xp >= 250) { level = 3; levelStart = 250; levelEnd = 450; }
      else if (xp >= 100) { level = 2; levelStart = 100; levelEnd = 250; }

      const progress = Math.min(
        100,
        Math.round(((xp - levelStart) / (levelEnd - levelStart)) * 100)
      );

      document.getElementById("statLevel").textContent = level;
      document.getElementById("levelCurrent").textContent = "سطح " + level;
      document.getElementById("levelNext").textContent =
        "تا سطح بعدی " + (levelEnd - xp) + " XP";
      document.getElementById("levelBar").style.width = progress + "%";

      /* پیشرفت حسابان — بر اساس تعداد سوالات حل‌شده */
      const totalQuestions = 5; /* ۳ سوال درس ۱ + ۲ سوال درس ۲ */
      const hesabanPercent = Math.min(
        100,
        Math.round((solved / totalQuestions) * 100)
      );

      const hesabanEl = document.getElementById("hesabanPercent");
      const hesabanText = document.getElementById("hesabanProgressText");

      if (hesabanEl) hesabanEl.textContent = hesabanPercent + "%";

      if (hesabanText) {
        if (hesabanPercent === 0) {
          hesabanText.textContent = "در حال یادگیری";
        } else if (hesabanPercent < 100) {
          hesabanText.textContent = solved + " از " + totalQuestions + " سوال حل شده";
        } else {
          hesabanText.textContent = "کامل شد! 🎉";
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      createMathBackground();
      renderProfile();
    });
  </script>

</body>
</html>
