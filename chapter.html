<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>فصل | یازدهم‌پلاس</title>

    <link
        rel="stylesheet"
        href="css/chapter.css"
    >
</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="chapter-header">

        <div class="header-right">

            <a
                href="hesaban.html"
                class="back-button"
            >
                ← بازگشت
            </a>

            <div class="header-title">
                یازدهم‌پلاس
            </div>

        </div>


        <div class="header-user">

            <span id="headerUsername">
                کاربر
            </span>

            <span class="header-separator">
                |
            </span>

            <span>
                XP:
                <strong id="headerXP">0</strong>
            </span>

        </div>

    </header>


    <!-- ================================
         MAIN
    ================================= -->

    <main class="chapter-container">

        <!-- Breadcrumb -->

        <div class="breadcrumb">

            <a href="index.html">
                خانه
            </a>

            <span>←</span>

            <a href="hesaban.html">
                حسابان
            </a>

            <span>←</span>

            <span id="breadcrumbChapter">
                فصل
            </span>

        </div>


        <!-- Chapter Hero -->

        <section class="chapter-hero">

            <div class="chapter-number-box">

                <span>
                    فصل
                </span>

                <strong id="chapterNumber">
                    01
                </strong>

            </div>


            <div class="chapter-info">

                <span class="chapter-label">
                    حسابان ۱
                </span>

                <h1 id="chapterTitle">
                    در حال بارگذاری...
                </h1>

                <p id="chapterDescription">
                    اطلاعات فصل در حال بارگذاری است.
                </p>

            </div>

        </section>


        <!-- Progress -->

        <section class="progress-card">

            <div class="progress-header">

                <div>

                    <span class="progress-label">
                        پیشرفت فصل
                    </span>

                    <strong id="progressText">
                        0%
                    </strong>

                </div>

            </div>


            <div class="progress-bar">

                <div
                    id="progressFill"
                    class="progress-fill"
                    style="width: 0%;"
                ></div>

            </div>

        </section>


        <!-- Lessons -->

        <section class="lessons-section">

            <div class="section-header">

                <div>

                    <span>
                        مطالب فصل
                    </span>

                    <h2>
                        درس‌ها
                    </h2>

                    <p>
                        برای ورود به هر درس، آن را انتخاب کنید.
                    </p>

                </div>


                <div
                    id="lessonCount"
                    class="lesson-count"
                >
                    0 درس
                </div>

            </div>


            <div
                id="lessonGrid"
                class="lesson-grid"
            >

                <div class="loading">
                    در حال بارگذاری درس‌ها...
                </div>

            </div>

        </section>

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script src="js/user.js"></script>

    <script src="js/chapter.js"></script>

</body>

</html>
